[project]
name = "breast-cancer-cmmd"
version = "0.1.0"
description = "Breast cancer classification"
authors = ["Laurent Lejeune <me@lejeunel.org>"]
packages = [{include = 'breastclf'}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.1",
    "torch>=2.7.1",
    "pandas>=2.2.2",
    "typer>=0.19.2",
    "scikit-learn>=1.7.2",
    "scikit-image>=0.25.2",
    "torchvision>=0.23.0",
    "matplotlib>=3.10.6",
    "torcheval>=0.0.7",
    "tqdm>=4.67.1",
    "pydicom>=3.0.1",
    "requests>=2.32.5",
    "tensorboard>=2.20.0",
]

[tool.basedpyright]
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
